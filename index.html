<style>
  :root{
    --bg:#0e1116; --card:#171c24; --card2:#1e242e; --line:#2a323d;
    --txt:#e8edf3; --muted:#8b97a7; --acc:#f7a600; --acc2:#3a7afe;
    --ok:#25c26e; --warn:#f7a600; --bad:#ff4d5e;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  .hidden{display:none!important}

  /* LOGIN */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .loginbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:28px 22px;width:100%;max-width:360px;text-align:center}
  .loginbox h1{margin:0 0 4px;font-size:22px}
  .loginbox p{margin:0 0 20px;color:var(--muted);font-size:13px}
  .field{display:block;width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);font-size:16px;margin-bottom:12px}
  .btn{display:inline-block;width:100%;padding:13px;border:none;border-radius:10px;
    background:var(--acc);color:#231a00;font-weight:700;font-size:16px}
  .btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600}
  .btn.blue{background:var(--acc2);color:#fff}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);font-weight:600}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}

  /* APP */
  header{position:sticky;top:0;z-index:5;background:rgba(14,17,22,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:17px;margin:0;flex:1;display:flex;align-items:center;gap:8px}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--acc)}
  .iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:8px 11px;font-size:14px}
  main{max-width:820px;margin:0 auto;padding:14px 14px 90px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}

  .toolbar{display:flex;gap:8px;margin-bottom:14px}
  .toolbar input{flex:1;margin:0}
  .toolbar .btn{width:auto;white-space:nowrap;padding:12px 16px}

  .acct{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:14px;overflow:hidden}
  .acct-head{padding:13px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);background:var(--card2)}
  .acct-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;font-weight:700;
    word-break:break-all;flex:1;min-width:140px;display:flex;align-items:center;gap:8px}
  .copy-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;padding:0;background:transparent;border:1px solid var(--line);
    border-radius:8px;color:var(--muted);cursor:pointer;
    transition:color .15s,border-color .15s}
  .copy-btn:hover{color:var(--txt);border-color:var(--muted)}
  .copy-btn:active{transform:scale(.92)}
  .copy-btn svg{width:15px;height:15px;display:block}
  .copy-btn.ok{color:var(--ok);border-color:var(--ok)}
  .badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
  .badge.ok{background:rgba(37,194,110,.15);color:var(--ok)}
  .badge.warn{background:rgba(247,166,0,.15);color:var(--warn)}
  .badge.bad{background:rgba(255,77,94,.15);color:var(--bad)}
  .badge.none{background:var(--card);color:var(--muted);border:1px solid var(--line)}
  .mini{background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:6px 9px;font-size:12px}

  .slots{padding:8px 10px}
  .slot{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;
    border:1px solid var(--line);margin:6px 0;background:var(--card2)}
  .slot.empty{border-style:dashed;background:transparent}
  .slot-n{width:26px;height:26px;flex:none;border-radius:7px;background:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
  .slot-main{flex:1;min-width:0}
  .slot-title{font-weight:600;font-size:14px;word-break:break-word}
  .slot-sub{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .price{color:var(--acc);font-weight:700}
  .slot .mini{flex:none}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;
    justify-content:center;z-index:20}
  @media(min-width:560px){.overlay{align-items:center}}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;
    width:100%;max-width:460px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  @media(min-width:560px){.modal{border-radius:16px}}
  .modal h2{margin:0 0 4px;font-size:18px}
  .modal .hint{color:var(--muted);font-size:12px;margin:0 0 16px;word-break:break-all}
  label.lbl{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px}
  .row2{display:flex;gap:10px}
  .row2>div{flex:1}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .modal-actions .btn{flex:1}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000;
    color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;z-index:40;opacity:0;
    transition:opacity .25s;border:1px solid var(--line);pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  .empty-state{text-align:center;color:var(--muted);padding:40px 20px}
  .spin{text-align:center;color:var(--muted);padding:30px}
</style>
</head>
<body>

<!-- ====== CONFIGURA AQUÍ TU URL DE APPS SCRIPT ====== -->
<script>
  // Pega aquí la URL /exec de tu Web App de Apps Script (termina en /exec)
  var API_URL = "https://script.google.com/macros/s/AKfycbwTGTfuv_hLvt0P4FHPLJ8wk6P741YavD7By4fcgIByNFYNZcLsDPiBdEqkxFBqHXbm/exec";
</script>

<!-- LOGIN -->
<div id="login">
  <div class="loginbox">
    <h1>🔐 Mullvad</h1>
    <p>Registro y control de cuentas y dispositivos</p>
    <input id="pass" class="field" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" id="btnLogin">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <h1><span class="dot"></span> Mullvad</h1>
    <button class="iconbtn" id="btnReload">↻</button>
    <button class="iconbtn" id="btnLogout">Salir</button>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><b id="stCuentas">0</b><span>Cuentas</span></div>
      <div class="stat"><b id="stDisp">0</b><span>Dispositivos</span></div>
      <div class="stat"><b id="stTotal">0€</b><span>Total/mes</span></div>
    </div>
    <div class="toolbar">
      <input id="buscar" class="field" placeholder="Buscar código, cliente o dispositivo…">
      <button class="btn" id="btnNueva">+ Cuenta</button>
    </div>
    <div id="lista"><div class="spin">Cargando…</div></div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
var PASS = "";
var DATA = []; // cuentas

// ---------- JSONP robusto ----------
// Apps Script puede tardar bastante (arranque en frio) o fallar de forma puntual.
// Por eso: timeout largo, reintento automatico y, si la respuesta llega tarde,
// se aprovecha igual en vez de perderse.
var API_TIMEOUT = 45000;

function jsonp(params){
  return new Promise(function(resolve,reject){
    var cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    var s = null, listo = false;
    function quitarScript(){ if(s && s.parentNode) s.parentNode.removeChild(s); }
    function borrarCb(){ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } }

    var timeout = setTimeout(function(){
      if(listo) return;
      listo = true;
      quitarScript();
      // OJO: no borramos el callback. Si Google contesta tarde, lo aprovechamos.
      window[cb] = function(data){ borrarCb(); respuestaTardia(params, data); };
      setTimeout(borrarCb, 180000);
      reject(new Error('El servidor tarda demasiado, vuelve a intentarlo'));
    }, API_TIMEOUT);

    window[cb] = function(data){
      if(listo) return;
      listo = true; clearTimeout(timeout); quitarScript(); borrarCb();
      resolve(data);
    };

    var qs = 'callback=' + cb;
    for(var k in params){ if(params.hasOwnProperty(k)){
      qs += '&' + k + '=' + encodeURIComponent(params[k]==null?'':params[k]);
    }}
    s = document.createElement('script');
    s.src = API_URL + (API_URL.indexOf('?')>=0?'&':'?') + qs + '&_=' + Date.now();
    s.onerror = function(){
      if(listo) return;
      listo = true; clearTimeout(timeout); quitarScript(); borrarCb();
      var err = new Error('Fallo de red con el servidor'); err.red = true; reject(err);
    };
    document.body.appendChild(s);
  });
}

// Llamada normal por fetch: es mas rapida y da errores de verdad.
// (El backend responde JSON puro cuando no se le pide callback.)
function llamarFetch(params, msTimeout){
  var qs=[];
  for(var k in params){ if(params.hasOwnProperty(k)){
    qs.push(k+'='+encodeURIComponent(params[k]==null?'':params[k]));
  }}
  var url = API_URL + (API_URL.indexOf('?')>=0?'&':'?') + qs.join('&') + '&_=' + Date.now();
  var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var to = setTimeout(function(){ if(ctrl) ctrl.abort(); }, msTimeout || API_TIMEOUT);
  return fetch(url, {
      credentials:'omit',   // sin cookies de Google: evita los redirects de cuenta que cuelgan
      redirect:'follow',
      signal: ctrl ? ctrl.signal : undefined
    })
    .then(function(res){
      if(!res.ok){ var e=new Error('El servidor respondio '+res.status); e.red=true; throw e; }
      return res.text();
    })
    .then(function(txt){
      clearTimeout(to);
      txt = String(txt).trim();
      if(txt.charAt(0)!=='{'){               // por si llegara envuelto en JSONP
        var i=txt.indexOf('('), j=txt.lastIndexOf(')');
        if(i>=0 && j>i) txt = txt.slice(i+1, j);
      }
      return JSON.parse(txt);
    })
    .catch(function(e){
      clearTimeout(to);
      if(e && e.name==='AbortError'){
        var t=new Error('El servidor tarda demasiado, vuelve a intentarlo'); t.red=true; throw t;
      }
      if(e) e.red=true;
      throw e;
    });
}

function espera(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }

// Cuando Google se atasca, lo suyo es cortar pronto y volver a pedirlo:
// el segundo intento suele contestar en menos de un segundo.
var ESPERAS = [12000, 20000, 45000];

function api(params){
  if(!window.fetch || !window.Promise) return jsonp(params);
  function intento(n){
    return llamarFetch(params, ESPERAS[n]).catch(function(e){
      if(n < ESPERAS.length - 1){
        return espera(500).then(function(){ return intento(n+1); });
      }
      return jsonp(params);   // ultimo cartucho, por si fetch estuviese bloqueado
    });
  }
  return intento(0);
}

// Respuesta que llega despues de haber dado la llamada por perdida
function respuestaTardia(params, data){
  if(!data || !data.ok) return;
  if(data.cuentas){
    aplicarLista(data.cuentas);
    if(params.action!=='listar') toast('Llego con retraso, pero se guardo');
  } else if(params.action!=='listar'){
    cargar(true);
  }
}

// ---------- Utilidades ----------
function $(id){ return document.getElementById(id); }
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2200);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function diasHasta(fecha){
  if(!fecha) return null;
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var f=new Date(fecha+'T00:00:00');
  if(isNaN(f)) return null;
  return Math.round((f-hoy)/86400000);
}
function badgeFecha(fecha){
  if(!fecha) return '<span class="badge none">sin fecha</span>';
  var d=diasHasta(fecha);
  var txt=fmtFechaES(fecha);
  var cls='ok';
  if(d===null) return '<span class="badge none">'+esc(fecha)+'</span>';
  if(d<0){ cls='bad'; txt+=' · caducada'; }
  else if(d<=7){ cls='warn'; txt+=' · '+d+'d'; }
  else { txt+=' · '+d+'d'; }
  return '<span class="badge '+cls+'">'+txt+'</span>';
}
function fmtFechaES(f){
  if(!f) return '';
  var p=f.split('-'); if(p.length!==3) return f;
  return p[2]+'/'+p[1]+'/'+p[0];
}
function fmtImporte(v){
  if(v===''||v==null) return '';
  var n=Number(v); if(isNaN(n)) return '';
  return (Math.round(n*100)/100).toString().replace('.',',')+'€';
}

// ---------- LOGIN ----------
function tryRestore(){
  var p='';
  try{ p=localStorage.getItem('mv_pass')||''; }catch(e){}
  if(p){ PASS=p; enterApp(true); }
}
function doLogin(){
  var p=$('pass').value.trim();
  $('loginErr').textContent='';
  if(!p){ $('loginErr').textContent='Escribe la contraseña'; return; }
  if(API_URL.indexOf('PON_AQUI')>=0){
    $('loginErr').textContent='Falta configurar API_URL en el index.html';
    return;
  }
  $('btnLogin').textContent='Comprobando…'; $('btnLogin').disabled=true;
  api({action:'login',pass:p}).then(function(r){
    $('btnLogin').textContent='Entrar'; $('btnLogin').disabled=false;
    if(r&&r.ok&&r.valid){
      PASS=p;
      try{ localStorage.setItem('mv_pass',p); }catch(e){}
      enterApp();
    } else {
      $('loginErr').textContent='Contraseña incorrecta';
    }
  }).catch(function(e){
    $('btnLogin').textContent='Entrar'; $('btnLogin').disabled=false;
    $('loginErr').textContent=e.message;
  });
}
function enterApp(silent){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  cargar(silent);
}
function logout(){
  PASS='';
  DATA=[];
  try{ localStorage.removeItem('mv_pass'); localStorage.removeItem('mv_cache'); }catch(e){}
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('pass').value='';
}

// ---------- CARGAR / PINTAR ----------
function aplicarLista(cuentas){
  DATA = cuentas || [];
  try{ localStorage.setItem('mv_cache', JSON.stringify(DATA)); }catch(e){}
  pintar();
}
function pintarDesdeCache(){
  try{
    var c = localStorage.getItem('mv_cache');
    if(c){ var d = JSON.parse(c); if(d && d.length){ DATA = d; pintar(); return true; } }
  }catch(e){}
  return false;
}
function trasGuardar(r){
  if(r && r.cuentas) aplicarLista(r.cuentas);
  else cargar(true);
}
function cargar(silent){
  var hayDatos = (DATA && DATA.length) ? true : pintarDesdeCache();
  if(!silent && !hayDatos) $('lista').innerHTML='<div class="spin">Cargando\u2026</div>';
  api({action:'listar',pass:PASS}).then(function(r){
    if(!r||!r.ok){
      if(r&&r.error&&/contrase/i.test(r.error)){ logout(); return; }
      if(hayDatos) toast('Error: '+(r&&r.error||'?'));
      else $('lista').innerHTML='<div class="empty-state">Error: '+esc(r&&r.error||'?')+'</div>';
      return;
    }
    aplicarLista(r.cuentas||[]);
  }).catch(function(e){
    if(hayDatos) toast(e.message);
    else $('lista').innerHTML='<div class="empty-state">'+esc(e.message)+'</div>';
  });
}

// Deja el modal en modo "guardando" para que no se pueda pulsar dos veces
function modalOcupado(txt){
  var m = document.querySelector('.modal');
  if(!m) return function(){};
  var btns = m.querySelectorAll('button');
  var prim = m.querySelector('.modal-actions .btn:not(.sec)');
  var antes = prim ? prim.textContent : '';
  for(var i=0;i<btns.length;i++) btns[i].disabled = true;
  if(prim) prim.textContent = txt || 'Guardando\u2026';
  return function(){
    for(var i=0;i<btns.length;i++) btns[i].disabled = false;
    if(prim) prim.textContent = antes;
  };
}

var ICONO_COPIAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
var ICONO_OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>';

function botonCopiar(texto){
  return '<button type="button" class="copy-btn" data-copiar="'+esc(texto)+'"'
       + ' title="Copiar codigo" aria-label="Copiar codigo">'+ICONO_COPIAR+'</button>';
}

function copiarTexto(txt){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
  return new Promise(function(ok,mal){
    try{
      var ta=document.createElement('textarea');
      ta.value=txt; ta.setAttribute('readonly','');
      ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,999999);
      var hecho=document.execCommand('copy');
      document.body.removeChild(ta);
      hecho ? ok() : mal(new Error('sin permiso'));
    }catch(e){ mal(e); }
  });
}

document.addEventListener('click', function(ev){
  var b = ev.target && ev.target.closest ? ev.target.closest('.copy-btn') : null;
  if(!b) return;
  ev.preventDefault(); ev.stopPropagation();
  copiarTexto(b.getAttribute('data-copiar')||'').then(function(){
    b.classList.add('ok'); b.innerHTML=ICONO_OK; b.title='Copiado';
    clearTimeout(b._tc);
    b._tc=setTimeout(function(){ b.classList.remove('ok'); b.innerHTML=ICONO_COPIAR; b.title='Copiar codigo'; }, 1300);
  }).catch(function(){ b.title='No se pudo copiar'; });
});

function pintar(){
  var q=($('buscar').value||'').toLowerCase().trim();
  var cuentas=DATA;
  if(q){
    cuentas=DATA.filter(function(c){
      if(c.codigo.toLowerCase().indexOf(q)>=0) return true;
      return (c.dispositivos||[]).some(function(d){
        return (d.dispositivo||'').toLowerCase().indexOf(q)>=0
            || (d.cliente||'').toLowerCase().indexOf(q)>=0;
      });
    });
  }

  // stats (sobre todo el dataset, no el filtro)
  var totalDisp=0, totalMes=0;
  DATA.forEach(function(c){
    (c.dispositivos||[]).forEach(function(d){
      totalDisp++;
      if(d.importe!=='' && d.importe!=null && !isNaN(Number(d.importe))) totalMes+=Number(d.importe);
    });
  });
  $('stCuentas').textContent=DATA.length;
  $('stDisp').textContent=totalDisp;
  $('stTotal').textContent=(Math.round(totalMes*100)/100).toString().replace('.',',')+'€';

  if(!cuentas.length){
    $('lista').innerHTML='<div class="empty-state">'+(q?'Sin resultados':'Aún no hay cuentas. Pulsa “+ Cuenta”.')+'</div>';
    return;
  }

  var html='';
  cuentas.forEach(function(c){
    var disp=c.dispositivos||[];
    var mapa={};
    disp.forEach(function(d){ mapa[d.slot]=d; });

    html+='<div class="acct">';
    html+='<div class="acct-head">';
    html+='<div class="acct-code"><span>'+esc(c.codigo)+'</span>'+botonCopiar(c.codigo)+'</div>';
    html+='<div>Caduca cuenta '+badgeFecha(c.caduca)+'</div>';
    html+='<button class="mini" onclick="editarCuenta(\''+esc(c.codigo).replace(/'/g,"\\'")+'\')">✎ Cuenta</button>';
    html+='</div>';

    html+='<div class="slots">';
    for(var s=1;s<=5;s++){
      var d=mapa[s];
      if(d && (d.dispositivo||d.cliente||d.pagadoHasta||d.importe!=='')){
        html+='<div class="slot">';
        html+='<div class="slot-n">'+s+'</div>';
        html+='<div class="slot-main">';
        html+='<div class="slot-title">'+esc(d.dispositivo||'(sin nombre)')+'</div>';
        html+='<div class="slot-sub">';
        if(d.cliente) html+='<span>👤 '+esc(d.cliente)+'</span>';
        html+='<span>Paga hasta: '+badgeFecha(d.pagadoHasta)+'</span>';
        if(d.importe!=='' && d.importe!=null) html+='<span class="price">'+fmtImporte(d.importe)+'</span>';
        if(d.router){
          var rlbl = d.router==='Propio'?'📶 Router propio' : (d.router==='Cedido'?'📡 Router cedido' : '🔌 Otros');
          html+='<span>'+rlbl+'</span>';
          if(d.router==='Cedido' && d.deposito!=='' && d.deposito!=null) html+='<span>Depósito: '+fmtImporte(d.deposito)+'</span>';
        }
        html+='</div></div>';
        html+='<button class="mini" onclick="editarDisp(\''+esc(c.codigo).replace(/'/g,"\\'")+'\','+s+')">✎</button>';
        html+='</div>';
      } else {
        html+='<div class="slot empty">';
        html+='<div class="slot-n">'+s+'</div>';
        html+='<div class="slot-main"><div class="slot-title" style="color:var(--muted);font-weight:500">Dispositivo '+s+' · libre</div></div>';
        html+='<button class="mini" onclick="editarDisp(\''+esc(c.codigo).replace(/'/g,"\\'")+'\','+s+')">+ Añadir</button>';
        html+='</div>';
      }
    }
    html+='</div></div>';
  });
  $('lista').innerHTML=html;
}

// ---------- MODALES ----------
function closeModal(){ $('modalRoot').innerHTML=''; }
function findCuenta(cod){ for(var i=0;i<DATA.length;i++){ if(DATA[i].codigo===cod) return DATA[i]; } return null; }

function nuevaCuenta(){
  var html=''
  +'<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'
  +'<h2>Nueva cuenta Mullvad</h2>'
  +'<p class="hint">El número de cuenta de Mullvad. Debajo podrás ir añadiendo hasta 5 dispositivos.</p>'
  +'<label class="lbl">Código Mullvad</label>'
  +'<input id="m_cod" class="field" placeholder="Ej: 1234 5678 9012 3456" autocomplete="off">'
  +'<label class="lbl">Caduca la cuenta (hasta cuándo has pagado Mullvad)</label>'
  +'<input id="m_cad" class="field" type="date">'
  +'<label class="lbl">Notas (opcional)</label>'
  +'<input id="m_notas" class="field" placeholder="">'
  +'<div class="modal-actions">'
  +'<button class="btn sec" onclick="closeModal()">Cancelar</button>'
  +'<button class="btn" onclick="guardarNuevaCuenta()">Crear</button>'
  +'</div></div></div>';
  $('modalRoot').innerHTML=html;
  setTimeout(function(){ var el=$('m_cod'); if(el) el.focus(); },50);
}
function guardarNuevaCuenta(){
  var cod=($('m_cod').value||'').trim();
  if(!cod){ toast('Escribe el código'); return; }
  var fin=modalOcupado('Creando\u2026');
  api({action:'altaCuenta',pass:PASS,codigo:cod,caduca:$('m_cad').value||'',notas:$('m_notas').value||''})
  .then(function(r){
    fin();
    if(r&&r.ok){ closeModal(); toast('Cuenta creada'); trasGuardar(r); }
    else toast(r&&r.error||'Error');
  }).catch(function(e){ fin(); toast(e.message); });
}

function editarCuenta(cod){
  var c=findCuenta(cod); if(!c) return;
  var html=''
  +'<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'
  +'<h2>Cuenta Mullvad</h2>'
  +'<p class="hint">'+esc(cod)+'</p>'
  +'<label class="lbl">Caduca la cuenta (edítalo al pagar más meses)</label>'
  +'<input id="e_cad" class="field" type="date" value="'+esc(c.caduca||'')+'">'
  +'<label class="lbl">Notas</label>'
  +'<input id="e_notas" class="field" value="'+esc(c.notas||'')+'">'
  +'<div class="modal-actions">'
  +'<button class="btn sec" onclick="closeModal()">Cancelar</button>'
  +'<button class="btn" onclick="guardarCuenta(\''+esc(cod).replace(/'/g,"\\'")+'\')">Guardar</button>'
  +'</div>'
  +'<div style="margin-top:14px;text-align:center">'
  +'<button class="btn danger" onclick="borrarCuenta(\''+esc(cod).replace(/'/g,"\\'")+'\')">Borrar cuenta completa</button>'
  +'</div>'
  +'</div></div>';
  $('modalRoot').innerHTML=html;
}
function guardarCuenta(cod){
  var fin=modalOcupado();
  api({action:'guardarCaducidad',pass:PASS,codigo:cod,caduca:$('e_cad').value||'',notas:$('e_notas').value||''})
  .then(function(r){
    fin();
    if(r&&r.ok){ closeModal(); toast('Guardado'); trasGuardar(r); }
    else toast(r&&r.error||'Error');
  }).catch(function(e){ fin(); toast(e.message); });
}
function borrarCuenta(cod){
  if(!confirm('¿Borrar la cuenta '+cod+' y todos sus dispositivos?')) return;
  var fin=modalOcupado('Borrando\u2026');
  api({action:'borrarCuenta',pass:PASS,codigo:cod}).then(function(r){
    fin();
    if(r&&r.ok){ closeModal(); toast('Cuenta borrada'); trasGuardar(r); }
    else toast(r&&r.error||'Error');
  }).catch(function(e){ fin(); toast(e.message); });
}

function editarDisp(cod,slot){
  var c=findCuenta(cod);
  var d=null;
  if(c){ (c.dispositivos||[]).forEach(function(x){ if(x.slot===slot) d=x; }); }
  d=d||{dispositivo:'',cliente:'',pagadoHasta:'',importe:''};
  var html=''
  +'<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'
  +'<h2>Dispositivo '+slot+' de 5</h2>'
  +'<p class="hint">'+esc(cod)+'</p>'
  +'<label class="lbl">Nombre del dispositivo (el que le asignas en Mullvad)</label>'
  +'<input id="d_disp" class="field" value="'+esc(d.dispositivo||'')+'" placeholder="Ej: Router salón Juan">'
  +'<label class="lbl">Cliente</label>'
  +'<input id="d_cli" class="field" value="'+esc(d.cliente||'')+'" placeholder="Nombre del cliente">'
  +'<div class="row2">'
  +'<div><label class="lbl">Paga hasta</label><input id="d_pag" class="field" type="date" value="'+esc(d.pagadoHasta||'')+'"></div>'
  +'<div><label class="lbl">Importe (€)</label><input id="d_imp" class="field" type="number" inputmode="decimal" step="0.01" value="'+(d.importe===''||d.importe==null?'':esc(d.importe))+'" placeholder="0"></div>'
  +'</div>'
  +'<label class="lbl">Router que usa</label>'
  +'<select id="d_router" class="field" onchange="toggleDeposito()">'
  +'<option value="">— sin especificar —</option>'
  +'<option value="Propio"'+(d.router==='Propio'?' selected':'')+'>Router propio del cliente</option>'
  +'<option value="Cedido"'+(d.router==='Cedido'?' selected':'')+'>Router cedido por mí</option>'
  +'<option value="Otros"'+(d.router==='Otros'?' selected':'')+'>Otros (otro dispositivo)</option>'
  +'</select>'
  +'<div id="d_depwrap" class="'+(d.router==='Cedido'?'':'hidden')+'">'
  +'<label class="lbl">Depósito dejado (€)</label>'
  +'<input id="d_dep" class="field" type="number" inputmode="decimal" step="0.01" value="'+(d.deposito===''||d.deposito==null?'':esc(d.deposito))+'" placeholder="0">'
  +'</div>'
  +'<div class="modal-actions">'
  +'<button class="btn sec" onclick="closeModal()">Cancelar</button>'
  +'<button class="btn" onclick="guardarDisp(\''+esc(cod).replace(/'/g,"\\'")+'\','+slot+')">Guardar</button>'
  +'</div>';
  if(d.dispositivo||d.cliente||d.pagadoHasta||d.importe!==''){
    html+='<div style="margin-top:14px;text-align:center">'
    +'<button class="btn danger" onclick="borrarDisp(\''+esc(cod).replace(/'/g,"\\'")+'\','+slot+')">Vaciar este dispositivo</button>'
    +'</div>';
  }
  html+='</div></div>';
  $('modalRoot').innerHTML=html;
  setTimeout(function(){ var el=$('d_disp'); if(el) el.focus(); },50);
}
function toggleDeposito(){
  var v=$('d_router').value;
  var w=$('d_depwrap');
  if(!w) return;
  if(v==='Cedido') w.classList.remove('hidden'); else w.classList.add('hidden');
}
function guardarDisp(cod,slot){
  var router=$('d_router').value||'';
  var dep=(router==='Cedido') ? ($('d_dep').value||'') : '';
  var fin=modalOcupado();
  api({action:'guardarDispositivo',pass:PASS,codigo:cod,slot:slot,
    dispositivo:$('d_disp').value||'',cliente:$('d_cli').value||'',
    pagadoHasta:$('d_pag').value||'',importe:$('d_imp').value||'',
    router:router,deposito:dep})
  .then(function(r){
    fin();
    if(r&&r.ok){ closeModal(); toast('Guardado'); trasGuardar(r); }
    else toast(r&&r.error||'Error');
  }).catch(function(e){ fin(); toast(e.message); });
}
function borrarDisp(cod,slot){
  if(!confirm('¿Vaciar el dispositivo '+slot+'?')) return;
  var fin=modalOcupado('Vaciando\u2026');
  api({action:'borrarDispositivo',pass:PASS,codigo:cod,slot:slot}).then(function(r){
    fin();
    if(r&&r.ok){ closeModal(); toast('Vaciado'); trasGuardar(r); }
    else toast(r&&r.error||'Error');
  }).catch(function(e){ fin(); toast(e.message); });
}

// ---------- Eventos ----------
$('btnLogin').addEventListener('click',doLogin);
$('pass').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
$('btnLogout').addEventListener('click',logout);
$('btnReload').addEventListener('click',function(){ cargar(); toast('Actualizando…'); });
$('btnNueva').addEventListener('click',nuevaCuenta);
$('buscar').addEventListener('input',pintar);

// PWA: registrar service worker (instalable en el movil)
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
tryRestore();
</script>
